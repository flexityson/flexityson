<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="100%" height="240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="synapseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .terminal-text { font-family: 'Fira Code', 'JetBrains Mono', monospace; font-size: 13px; }
    .header-text { font-family: 'Fira Code', monospace; font-size: 11px; fill: #64748b; }
    .label-cyan { fill: #38bdf8; font-weight: 600; }
    .val-emerald { fill: #34d399; }
    .val-slate { fill: #94a3b8; }
    .val-purple { fill: #c084fc; }
    .val-yellow { fill: #facc15; }
    
    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    @keyframes pulseNodeGreen {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 8px #34d399); }
    }
    @keyframes pulseNodePurple {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 8px #a855f7); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -32; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes liveGlow {
      0%, 100% { fill: #10b981; filter: drop-shadow(0 0 2px #10b981); }
      50% { fill: #34d399; filter: drop-shadow(0 0 8px #34d399); }
    }

    .node-in { transform-origin: center; animation: pulseNode 3s infinite ease-in-out; }
    .node-mid { transform-origin: center; animation: pulseNodePurple 2.6s infinite ease-in-out; }
    .node-out { transform-origin: center; animation: pulseNodeGreen 3.2s infinite ease-in-out; }
    .synapse-active { stroke-dasharray: 4, 4; animation: dashFlow 1.8s linear infinite; }
    .synapse-fast { stroke-dasharray: 6, 4; animation: dashFlow 1.2s linear infinite; }
    .cursor { animation: blink 1s step-start infinite; }
    .live-dot { animation: liveGlow 1.6s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="836" height="236" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Terminal Top Header Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 824 2 Q 838 2 838 16 L 838 34 L 2 34 Z" fill="#0f172a" fill-opacity="0.8" />
  <line x1="2" y1="34" x2="838" y2="34" stroke="#1e293b" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  
  <!-- Terminal Title -->
  <text x="75" y="22" class="header-text">tyson@ai-core-runtime // autonomous_agent_pipeline.py</text>
  <text x="710" y="22" class="header-text" fill="#38bdf8">SYS_STATUS: 99.8%</text>

  <!-- LEFT: Interactive Neural Graph / Synapse Mesh -->
  <!-- Layer Guides -->
  <g opacity="0.15">
    <line x1="60" y1="50" x2="60" y2="215" stroke="#38bdf8" stroke-dasharray="2,4" />
    <line x1="125" y1="50" x2="125" y2="215" stroke="#818cf8" stroke-dasharray="2,4" />
    <line x1="190" y1="50" x2="190" y2="215" stroke="#a855f7" stroke-dasharray="2,4" />
    <line x1="255" y1="50" x2="255" y2="215" stroke="#34d399" stroke-dasharray="2,4" />
  </g>

  <!-- Connecting Synapses -->
  <!-- Input (60) to Hidden1 (125) -->
  <path d="M 60 85 L 125 70" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />
  <path d="M 60 85 L 125 110" stroke="#38bdf8" stroke-width="1.5" class="synapse-active" opacity="0.8" />
  <path d="M 60 85 L 125 150" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
  
  <path d="M 60 135 L 125 70" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
  <path d="M 60 135 L 125 110" stroke="#38bdf8" stroke-width="1.6" class="synapse-fast" opacity="0.8" />
  <path d="M 60 135 L 125 150" stroke="#38bdf8" stroke-width="1.4" class="synapse-active" opacity="0.7" />
  <path d="M 60 135 L 125 190" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
  
  <path d="M 60 185 L 125 110" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
  <path d="M 60 185 L 125 150" stroke="#38bdf8" stroke-width="1.5" class="synapse-active" opacity="0.8" />
  <path d="M 60 185 L 125 190" stroke="#38bdf8" stroke-width="1.2" opacity="0.4" />

  <!-- Hidden1 (125) to Hidden2 (190) -->
  <path d="M 125 70 L 190 85" stroke="#818cf8" stroke-width="1.5" class="synapse-active" opacity="0.8" />
  <path d="M 125 70 L 190 135" stroke="#818cf8" stroke-width="1" opacity="0.3" />
  
  <path d="M 125 110 L 190 85" stroke="#818cf8" stroke-width="1.6" class="synapse-fast" opacity="0.9" />
  <path d="M 125 110 L 190 135" stroke="#818cf8" stroke-width="1.2" opacity="0.5" />
  <path d="M 125 110 L 190 185" stroke="#818cf8" stroke-width="1" opacity="0.3" />

  <path d="M 125 150 L 190 85" stroke="#818cf8" stroke-width="1" opacity="0.3" />
  <path d="M 125 150 L 190 135" stroke="#818cf8" stroke-width="1.6" class="synapse-fast" opacity="0.9" />
  <path d="M 125 150 L 190 185" stroke="#818cf8" stroke-width="1.4" class="synapse-active" opacity="0.7" />

  <path d="M 125 190 L 190 135" stroke="#818cf8" stroke-width="1" opacity="0.3" />
  <path d="M 125 190 L 190 185" stroke="#818cf8" stroke-width="1.5" class="synapse-active" opacity="0.8" />

  <!-- Hidden2 (190) to Output (255) -->
  <path d="M 190 85 L 255 105" stroke="#34d399" stroke-width="1.8" class="synapse-fast" opacity="0.95" />
  <path d="M 190 85 L 255 165" stroke="#34d399" stroke-width="1" opacity="0.3" />

  <path d="M 190 135 L 255 105" stroke="#34d399" stroke-width="1.5" class="synapse-active" opacity="0.8" />
  <path d="M 190 135 L 255 165" stroke="#34d399" stroke-width="1.6" class="synapse-fast" opacity="0.9" />

  <path d="M 190 185 L 255 105" stroke="#34d399" stroke-width="1" opacity="0.3" />
  <path d="M 190 185 L 255 165" stroke="#34d399" stroke-width="1.8" class="synapse-fast" opacity="0.95" />

  <!-- Input Nodes -->
  <g>
    <circle cx="60" cy="85" r="5.5" fill="#38bdf8" class="node-in" filter="url(#nodeGlow)" />
    <circle cx="60" cy="135" r="6" fill="#38bdf8" class="node-in" filter="url(#nodeGlow)" />
    <circle cx="60" cy="185" r="5.5" fill="#38bdf8" class="node-in" filter="url(#nodeGlow)" />
  </g>

  <!-- Hidden Layer 1 Nodes -->
  <g>
    <circle cx="125" cy="70" r="5" fill="#818cf8" class="node-mid" />
    <circle cx="125" cy="110" r="5.5" fill="#818cf8" class="node-mid" filter="url(#nodeGlow)" />
    <circle cx="125" cy="150" r="5.5" fill="#818cf8" class="node-mid" filter="url(#nodeGlow)" />
    <circle cx="125" cy="190" r="5" fill="#818cf8" class="node-mid" />
  </g>

  <!-- Hidden Layer 2 Nodes -->
  <g>
    <circle cx="190" cy="85" r="5.5" fill="#c084fc" class="node-mid" filter="url(#nodeGlow)" />
    <circle cx="190" cy="135" r="6" fill="#c084fc" class="node-mid" filter="url(#nodeGlow)" />
    <circle cx="190" cy="185" r="5.5" fill="#c084fc" class="node-mid" filter="url(#nodeGlow)" />
  </g>

  <!-- Output Nodes -->
  <g>
    <circle cx="255" cy="105" r="6.5" fill="#34d399" class="node-out" filter="url(#nodeGlow)" />
    <circle cx="255" cy="165" r="6.5" fill="#34d399" class="node-out" filter="url(#nodeGlow)" />
  </g>

  <!-- Layer Labels -->
  <text x="60" y="218" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">INPUT</text>
  <text x="125" y="218" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">TENSORS</text>
  <text x="190" y="218" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">AGENTS</text>
  <text x="255" y="218" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748b">ACTUATE</text>

  <!-- Vertical Divider Line -->
  <line x1="305" y1="45" x2="305" y2="225" stroke="#1e293b" stroke-width="1.5" />

  <!-- RIGHT: System HUD & Telemetry -->
  <g transform="translate(325, 45)">
    <!-- Line 1: Identity & Environment -->
    <text x="0" y="20" class="terminal-text">
      <tspan class="label-cyan">▸ OPERATOR:</tspan>
      <tspan class="val-slate"> Flexityson </tspan>
      <tspan fill="#475569">|</tspan>
      <tspan class="label-cyan"> FOCUS:</tspan>
      <tspan class="val-purple"> AI Engineering &amp; Autonomous Agents</tspan>
    </text>

    <!-- Line 2: Active Architecture -->
    <text x="0" y="44" class="terminal-text">
      <tspan class="label-cyan">▸ AGENT_STACK:</tspan>
      <tspan class="val-emerald"> Claude Code </tspan>
      <tspan fill="#475569">•</tspan>
      <tspan class="val-emerald"> Model Context Protocol (MCP) </tspan>
      <tspan fill="#475569">•</tspan>
      <tspan class="val-emerald"> Hermes </tspan>
    </text>

    <!-- Line 3: Deep Learning & Vision Core -->
    <text x="0" y="68" class="terminal-text">
      <tspan class="label-cyan">▸ ML_KERNELS:</tspan>
      <tspan class="val-slate"> PyTorch 2.x • OpenCV Liveness Anti-Spoof • Custom CNNs</tspan>
    </text>

    <!-- Line 4: Quant & Market Systems -->
    <text x="0" y="92" class="terminal-text">
      <tspan class="label-cyan">▸ QUANT_ENG:</tspan>
      <tspan class="val-slate"> Order Flow • Auction Market Theory • MT5 &amp; Telegram Bot</tspan>
    </text>

    <!-- Line 5: System Metrics -->
    <text x="0" y="116" class="terminal-text">
      <tspan class="label-cyan">▸ TELEMETRY:</tspan>
      <tspan class="val-yellow"> Latency: 12ms </tspan>
      <tspan fill="#475569">|</tspan>
      <tspan class="val-yellow"> Val Loss: 0.021 </tspan>
      <tspan fill="#475569">|</tspan>
      <tspan class="val-yellow"> Precision: 98.6% </tspan>
    </text>

    <!-- Line 6: Status & Blinking Prompt -->
    <text x="0" y="145" class="terminal-text">
      <tspan class="label-cyan">▸ RUNTIME_LOOP:</tspan>
      <tspan class="val-emerald"> [● 24/7 AUTONOMOUS ACTIVE] </tspan>
      <tspan class="val-slate">awaiting_dispatch</tspan>
      <tspan class="cursor" fill="#38bdf8"> █</tspan>
    </text>

    <!-- Progress / Health Bar -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="485" height="4" rx="2" fill="#1e293b" />
      <rect x="0" y="0" width="420" height="4" rx="2" fill="url(#synapseGrad)" />
      <circle cx="420" cy="2" r="3" fill="#34d399" class="live-dot" />
    </g>
  </g>
</svg>
